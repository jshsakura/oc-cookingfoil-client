name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libjson-c-dev libcurl4-openssl-dev fonts-noto-cjk ripgrep
      - run: make test host
      - run: ./build-host/cookingfoil-host --fixture host/fixtures --shot out/
      - uses: actions/upload-artifact@v4
        with:
          name: host-screens
          path: out/*.png
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: make -j4
      - uses: actions/upload-artifact@v4
        with:
          name: cookingfoil-nro
          path: cookingfoil.nro
