name: Release
# Pushing a tag vX.Y.Z builds cookingfoil.nro and publishes it on a GitHub
# Release, with the licenses that must travel with the binary.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Tag matches APP_VERSION
        run: |
          version="$(sed -n 's/^APP_VERSION := //p' makefiles/switch.mk)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match APP_VERSION $version in makefiles/switch.mk" >&2
            exit 1
          fi
      - run: make -j4
      - uses: actions/upload-artifact@v4
        with:
          name: cookingfoil-nro
          path: cookingfoil.nro
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: cookingfoil-nro
      - name: Bundle the binary with its licenses
        run: |
          mkdir -p "cookingfoil-$GITHUB_REF_NAME/licenses"
          cp cookingfoil.nro LICENSE THIRD_PARTY_NOTICES.md "cookingfoil-$GITHUB_REF_NAME/"
          cp romfs/fonts/OFL*.txt "cookingfoil-$GITHUB_REF_NAME/licenses/"
          cp third_party/CyberFoil/LICENSE "cookingfoil-$GITHUB_REF_NAME/licenses/CyberFoil-LICENSE"
          cp third_party/CyberFoil/Tinfoil.LICENSE third_party/CyberFoil/awoo.LICENSE "cookingfoil-$GITHUB_REF_NAME/licenses/"
          cp romfs/README.txt "cookingfoil-$GITHUB_REF_NAME/licenses/cacert-README.txt"
          zip -r "cookingfoil-$GITHUB_REF_NAME.zip" "cookingfoil-$GITHUB_REF_NAME"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cookingfoil.nro
            cookingfoil-${{ github.ref_name }}.zip
          generate_release_notes: true
          make_latest: true
